<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keldsen Hub</title>
<meta name="description" content="A collection of solutions live on keldsen.org">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>
  :root {
    --bg: #0a0a0f;
    --bg-elev: #131319;
    --card: #17171f;
    --card-hover: #1e1e28;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #f2f2f5;
    --text-dim: #9797a3;
    --text-faint: #5f5f6b;
    --accent: #7c6cff;
    --accent2: #ff6ca8;
    --accent3: #4fd6c8;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,108,255,0.16), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(255,108,168,0.12), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(79,214,200,0.10), transparent 45%);
    pointer-events: none;
  }

  /* ---------- Gate ---------- */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  #gate.hidden {
    display: none;
  }

  .gate-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding: 0 24px;
  }

  .gate-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 12px 40px rgba(124,108,255,0.35);
  }

  .gate-card h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .gate-card p {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 28px;
  }

  #gate-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    text-align: center;
    letter-spacing: 0.15em;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  #gate-input:focus {
    border-color: var(--accent);
  }

  #gate-input.shake {
    animation: shake 0.4s ease;
    border-color: var(--accent2);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  #gate-btn {
    width: 100%;
    margin-top: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #6355e0);
    color: white;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  #gate-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,108,255,0.35);
  }

  #gate-btn:active {
    transform: translateY(0);
  }

  .gate-error {
    color: var(--accent2);
    font-size: 13px;
    margin-top: 14px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .gate-error.show { opacity: 1; }

  /* ---------- App ---------- */
  #app {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px 80px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #app.visible { opacity: 1; }

  header.hero {
    padding: 72px 0 48px;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
  }

  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent3);
    box-shadow: 0 0 8px var(--accent3);
  }

  header.hero h1 {
    font-size: clamp(36px, 6vw, 58px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    background: linear-gradient(135deg, #ffffff 30%, #b6b3d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
  }

  header.hero p {
    color: var(--text-dim);
    font-size: 17px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat strong {
    display: block;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .stat span {
    font-size: 12px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    margin-top: 24px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), border-color 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: var(--border-hover);
    box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6);
  }

  .card:hover .thumb img {
    transform: scale(1.06);
  }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: var(--bg-elev);
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
  }

  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(23,23,31,0.9) 100%);
  }

  .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    font-size: 22px;
    width: 40px;
    height: 40px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  .open-icon {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(10,10,15,0.55);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .card:hover .open-icon {
    opacity: 1;
    transform: translateY(0);
  }

  .open-icon svg {
    width: 14px;
    height: 14px;
    stroke: white;
  }

  .upload-icon {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 3;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(10,10,15,0.65);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
    cursor: pointer;
    border: none;
  }

  .card:hover .upload-icon {
    opacity: 1;
    transform: translateY(0);
  }

  .upload-icon:hover {
    background: rgba(124,108,255,0.85);
  }

  .upload-icon svg {
    width: 15px;
    height: 15px;
    stroke: white;
  }

  .upload-icon.busy {
    opacity: 1;
    transform: translateY(0);
    cursor: default;
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 200;
    background: var(--card);
    border: 1px solid var(--border-hover);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13.5px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .card-body {
    padding: 18px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-body h3 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .card-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-body p {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .card-url {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-url::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent3);
  }

  footer {
    text-align: center;
    margin-top: 72px;
    color: var(--text-faint);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    #app { padding: 0 18px 60px; }
    header.hero { padding: 56px 0 36px; }
    .grid { grid-template-columns: 1fr; gap: 18px; }
  }
</style>
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <div class="gate-icon">🔒</div>
      <h1>Keldsen Hub</h1>
      <p>Enter the passcode to continue</p>

  <div id="toast"></div>
  <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" style="display:none" />

    },

      url: "https://vault.keldsen.org",

      url: "https://yard.keldsen.org",

    },
    {

      url: "https://sete-apartment.vercel.app",
      slug: "sunsete",

    {

      desc: "Coaching business platform — CRM for clients and sessions, plus a client portal with CliftonStrengths and AI coaching chat.",
      url: "https://my.coachitfurther.com",
      slug: "coaching",

      color: "#00649a"
    },
    {
      name: "Status",
      tag: "Infra",
      desc: "Infrastructure monitoring for the EliteMini and self-hosted services — uptime heartbeats, docker image updates, and backup freshness in one dashboard.",
      url: "https://status.keldsen.org",
      slug: "status",
      img: "img/status.jpg",
      icon: "🛰️",
      color: "#0d4f3c"
    }
  ];

  function render() {
    const grid = document.getElementById("grid");
    const statsRow = document.getElementById("stats-row");

    grid.innerHTML = apps.map(app => `
      <a class="card" href="${app.url}" target="_blank" rel="noopener">
        <div class="thumb">
          <div class="badge" style="background:${app.color}">${app.icon}</div>
          <div class="open-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M17 7H7M17 7V17"/>
            </svg>
          </div>
          <button type="button" class="upload-icon" data-slug="${app.slug}" title="Upload a new screenshot" aria-label="Upload a new screenshot for ${app.name}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M12 4L7 9M12 4l5 5"/>
              <path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>
            </svg>
          </button>
          <img src="${app.img}" alt="${app.name} screenshot" loading="lazy" data-slug="${app.slug}" />
        </div>
        <div class="card-body">
          <div class="card-title-row">
            <h3>${app.name}</h3>
            <span class="card-tag" style="background:${app.color}33; color:#fff">${app.tag}</span>
          </div>
          <p>${app.desc}</p>
          <div class="card-url">${app.url.replace('https://','')}</div>
        </div>
      </a>
    `).join("");

    statsRow.innerHTML = `
      <div class="stat"><strong>${apps.length}</strong><span>Live Solutions</span></div>
      <div class="stat"><strong>100%</strong><span>Self-Hosted</span></div>
      <div class="stat"><strong>keldsen.org</strong><span>One Domain</span></div>
    `;
  }

  let toastTimer = null;
  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
  }

  function getAdminKey() {
    let key = localStorage.getItem("hub_admin_key");
    if (!key) {
      key = prompt("Admin key (one-time, saved on this device):");
      if (key) localStorage.setItem("hub_admin_key", key);
    }
    return key;
  }

  // Crop to 16:10 (center crop) and downscale to 960px wide, matching the
  // convention every bundled screenshot already follows — so an upload from
  // any source photo/screenshot ends up sized consistently with the rest.
  function processImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Could not read file"));
      reader.onload = () => { img.src = reader.result; };
      img.onerror = () => reject(new Error("Could not decode image"));
      img.onload = () => {
        const targetRatio = 16 / 10;
        const srcRatio = img.width / img.height;
        let sx = 0, sy = 0, sw = img.width, sh = img.height;
        if (srcRatio > targetRatio) {
          sw = img.height * targetRatio;
          sx = (img.width - sw) / 2;
        } else {
          sh = img.width / targetRatio;
          sy = (img.height - sh) / 2;
        }
        const canvas = document.createElement("canvas");
        canvas.width = 960;
        canvas.height = 600;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 960, 600);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      reader.readAsDataURL(file);
    });
  }

  let pendingSlug = null;

  function requestUpload(slug) {
    pendingSlug = slug;
    document.getElementById("file-input").click();
  }

  async function handleFileChosen(file) {
    const slug = pendingSlug;
    if (!slug || !file) return;
    const key = getAdminKey();
    if (!key) return;

    const btn = document.querySelector(`.upload-icon[data-slug="${slug}"]`);
    if (btn) btn.classList.add("busy");

    try {
      const dataUrl = await processImage(file);
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": key },
        body: JSON.stringify({ slug, dataUrl }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Upload failed");

      const app = apps.find(a => a.slug === slug);
      if (app) app.img = body.url;
      const imgEl = document.querySelector(`img[data-slug="${slug}"]`);
      if (imgEl) imgEl.src = body.url;
      toast(`Screenshot updated for ${app ? app.name : slug}.`);
    } catch (e) {
      if (String(e.message || "").includes("Unauthorized")) {
        localStorage.removeItem("hub_admin_key");
      }
      toast(`Upload failed: ${e.message || e}`);
    } finally {
      if (btn) btn.classList.remove("busy");
    }
  }

  document.getElementById("grid").addEventListener("click", e => {
    const btn = e.target.closest(".upload-icon");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    requestUpload(btn.dataset.slug);
  });

  document.getElementById("file-input").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    handleFileChosen(file);
  });

  async function loadManifestOverrides() {
    try {
      const res = await fetch("/api/manifest");
      if (!res.ok) return;
      const manifest = await res.json();
      for (const app of apps) {
        if (manifest[app.slug]) app.img = manifest[app.slug];
      }
    } catch (e) {
      // No manifest yet, or offline — bundled screenshots are still shown.
    }
  }

  function unlock() {
    document.getElementById("gate").classList.add("hidden");
    const app = document.getElementById("app");
    app.classList.add("visible");
    try { sessionStorage.setItem("hub_unlocked", "1"); } catch (e) {}
  }

  function tryUnlock() {
    const input = document.getElementById("gate-input");
    const error = document.getElementById("gate-error");
    if (input.value === PASSCODE) {
      unlock();
    } else {
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      error.classList.add("show");
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", e => {
    if (e.key === "Enter") tryUnlock();
  });

  // Render immediately with the bundled defaults (page is hidden behind the gate
  // anyway), then swap in any uploaded screenshots once the manifest arrives.
  render();
  loadManifestOverrides().then(render);

  let alreadyUnlocked = false;
  try { alreadyUnlocked = sessionStorage.getItem("hub_unlocked") === "1"; } catch (e) {}

  if (alreadyUnlocked) {
    unlock();
  } else {
    document.getElementById("gate-input").focus();
  }
</script>
</body>
</html>
